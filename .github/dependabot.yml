version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major-review:
        patterns: ["*"]
        update-types: ["major"]

  # Keep the TypeScript and Node type majors aligned with the tested Node 22 baseline.
  # Major migrations require deliberate compatibility checks across both blueprints.
  - package-ecosystem: npm
    directory: "/blueprints/saas-nextjs-postgres"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/blueprints/saas-nextjs-supabase"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
