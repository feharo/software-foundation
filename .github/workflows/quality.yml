name: Foundation Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate catalog and profiles
        run: python3 scripts/validate_foundation.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
