name: Clean old merged PR branches

# This checks the SHA before deleting, and never touches branches with open PRs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repo-branch-hygiene
  cancel-in-progress: false

jobs:
  clean:
    if: github.repository == 'feharo/software-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Remove stale closed PR heads only
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/cleanup_branches.py
