name: Histórico Git - Segredos
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * 1'
permissions:
  contents: read
jobs:
  audit-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify full history is available
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          count="$(git rev-list --all --count)"
          test "$count" -gt 0
          echo "Repository history available (count: $count)"
      - name: Scan all reachable Git history using Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          # Docker image version is pinned; never upload scanner logs, reports or secret matches.
          IMAGE="ghcr.io/gitleaks/gitleaks:v8.30.1"
          COUNT="$(git rev-list --all --count)"
          MOUNT="type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly"
          # Prevent 'dubious ownership' from causing an empty 0-commit scan.
          GIT_ENV=( -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo )
          container_count="$(docker run --rm --mount "$MOUNT" "${GIT_ENV[@]}" --entrypoint git "$IMAGE" -C /repo rev-list --all --count)"
          if [ "$container_count" -lt 1 ] || [ "$container_count" != "$COUNT" ]; then
            echo "::error::Git refs unavailable inside scanner container"
            exit 1
          fi
          log="$RUNNER_TEMP/gitleaks-output.log"
          status=0
          docker run --rm --mount "$MOUNT" "${GIT_ENV[@]}" "$IMAGE" \
            git --no-banner --no-color --redact=100 --log-opts="--all" /repo \
            > "$log" 2>&1 || status=$?
          python3 scripts/verify_history_scan.py "$log" "$status"
