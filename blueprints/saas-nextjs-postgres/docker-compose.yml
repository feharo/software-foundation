# APENAS para desenvolvimento local. Não publique estas credenciais.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: foundation
      POSTGRES_PASSWORD: localdevonly
      POSTGRES_DB: foundation
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - foundation_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d foundation"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  foundation_pg_data:
